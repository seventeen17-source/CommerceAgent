spring:
  application:
    name: commerce-backend
  datasource:
    url: ${COMMERCE_DB_URL:jdbc:postgresql://localhost:5432/commerceagent}
    username: ${COMMERCE_DB_USER:commerceagent}
    password: ${COMMERCE_DB_PASSWORD:commerceagent}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: commerce
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    default-schema: public
    schemas: public,commerce,agent,policy,eval
    create-schemas: true

server:
  port: ${COMMERCE_BACKEND_PORT:8080}

commerceagent:
  security:
    jwt-secret: ${COMMERCE_JWT_SECRET:dev-only-change-me-please-32-bytes}
    issuer: ${COMMERCE_JWT_ISSUER:commerceagent-local}
  eval:
    reset-enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
