openapi: 3.1.0
info:
  title: CommerceAgent Business Backend API
  version: 0.2.1
  description: |
    ## Ownership concealment rule (T019)

    Order-scoped resources never reveal whether an order exists to a principal that is not
    allowed to see it.

    * An order that **does not exist** and an order that **belongs to someone else** MUST
      produce exactly the same response: same status (`404`), same `errorCode`
      (`ORDER_NOT_FOUND`), same `message`. Implementations must not add a "friendlier" or
      "more precise" message for one of the two cases.
    * `403` on these endpoints therefore has exactly one meaning: the authenticated
      principal lacks the role/capability required by the endpoint (`ACCESS_DENIED`). It is
      **never** used for ownership failures, because `403` literally asserts that the
      resource exists — which would turn the endpoint into an existence oracle. This
      matters concretely here: order ids in this system are enumerable (`order-001`).
    * `ORDER_FORBIDDEN` was removed from the error taxonomy for the same reason: it
      described a cross-owner customer read, and a cross-owner read must not be
      distinguishable from "not found".
    * Concealing the reason from the caller is **not** the same as losing it. The backend
      still records the true reason internally as a structured security audit event
      (`ORDER_ACCESS_DENIED`, `metadata.reason = CROSS_OWNER`).
servers:
  - url: http://commerce-backend:8080/api/v1
paths:
  /me:
    get:
      summary: Get authoritative authenticated principal
      description: Returns the current user id and role resolved by the Java backend from the verified JWT subject and authoritative commerce.users record. Consumers must not trust a caller/model supplied role.
      responses:
        '200':
          description: Current authoritative principal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentPrincipal' }
        '401': { $ref: '#/components/responses/Error' }
  /orders:
    get:
      summary: List authenticated user's orders
      description: Returns only orders owned by the authenticated customer principal. Ownership is a SQL predicate, so another user's order can never appear in the result set.
      parameters:
        - in: query
          name: productQuery
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
      responses:
        '200':
          description: Order summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrderSummary' }
        '401': { $ref: '#/components/responses/Error' }
  /orders/{orderId}:
    get:
      summary: Get authoritative order snapshot
      description: Returns the order only when it belongs to the authenticated customer principal. Nonexistent orders and orders owned by another user are deliberately indistinguishable; see the ownership concealment rule in the API description.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderSnapshot' }
        '401': { $ref: '#/components/responses/Error' }
        '403':
          $ref: '#/components/responses/Error'
          description: |
            ACCESS_DENIED only: the authenticated principal lacks the role/capability this
            endpoint requires. Never emitted for an ownership failure.
        '404':
          $ref: '#/components/responses/Error'
          description: |
            ORDER_NOT_FOUND, returned identically for "order does not exist" and "order
            belongs to another user".
  /orders/{orderId}/logistics:
    get:
      summary: Get authoritative logistics snapshot
      description: Returns logistics only when the order belongs to the authenticated customer principal. The ownership check runs before any logistics read, because shipment traces are sensitive data in their own right.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Logistics snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogisticsSnapshot' }
        '401': { $ref: '#/components/responses/Error' }
        '403':
          $ref: '#/components/responses/Error'
          description: |
            ACCESS_DENIED only: role/capability, never ownership.
        '404':
          $ref: '#/components/responses/Error'
          description: |
            ORDER_NOT_FOUND, returned identically for "order does not exist" and "order
            belongs to another user". Added in T019: this endpoint previously declared no
            404 at all, which contradicted the concealment rule.
        '503':
          $ref: '#/components/responses/Error'
          description: |
            LOGISTICS_UNAVAILABLE: the order exists and is accessible, but no authoritative
            logistics record is available. Consumers must not infer a logistics state from
            its absence (US5 requires escalating instead of guessing).
  /after-sales/eligibility:
    post:
      summary: Deterministically evaluate refund/return eligibility
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EligibilityRequest' }
      responses:
        '200':
          description: Eligibility decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EligibilityDecision' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /refunds:
    post:
      summary: Create idempotent refund request
      description: The backend revalidates authenticated ownership, current state, eligibility, amount, approval record, and idempotency immediately before commit.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRefundRequest' }
      responses:
        '200':
          description: Existing or newly created logical refund
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundResult' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /returns:
    post:
      summary: Create idempotent return request
      description: The backend revalidates authenticated ownership, current state, eligibility, approval record, and idempotency immediately before commit.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReturnRequest' }
      responses:
        '200':
          description: Existing or newly created logical return
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnResult' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /support-tickets:
    post:
      summary: Create after-sales escalation ticket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTicketRequest' }
      responses:
        '201':
          description: Ticket created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketResult' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /approvals:
    post:
      summary: Create approval request
      description: Creates a PENDING authoritative approval record. This endpoint never approves an action.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateApprovalRequest' }
      responses:
        '201':
          description: Approval request created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalResult' }
        '401': { $ref: '#/components/responses/Error' }
    get:
      summary: List approval requests visible to an authorized approver
      description: Requires APPROVER role. Used by the Human-in-the-loop approval center.
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING, APPROVED, DENIED, EXPIRED]
      responses:
        '200':
          description: Approval requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApprovalResult' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /approvals/{approvalId}/decision:
    post:
      summary: Authorized human decides approval
      description: Only an authenticated APPROVER may transition PENDING to APPROVED or DENIED.
      parameters:
        - in: path
          name: approvalId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [APPROVE, DENY]
      responses:
        '200':
          description: Approval updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalResult' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /orders/{orderId}/after-sales:
    get:
      summary: Query current after-sales objects/status for verification and timeout recovery
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - in: query
          name: idempotencyKey
          schema: { type: string }
      responses:
        '200':
          description: Current after-sales status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSalesStatus' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrderId:
      in: path
      name: orderId
      required: true
      schema: { type: string }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 8 }
  responses:
    Error:
      description: Machine-readable error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    CurrentPrincipal:
      type: object
      required: [userId, role]
      properties:
        userId: { type: string, minLength: 1, maxLength: 64 }
        role:
          type: string
          enum: [CUSTOMER, APPROVER, SUPPORT]
    OrderSummary:
      type: object
      required: [orderId, productSummary, status, createdAt]
      properties:
        orderId: { type: string }
        productSummary: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
    OrderSnapshot:
      type: object
      required: [orderId, status, totalAmount, currency, items]
      properties:
        orderId: { type: string }
        status: { type: string }
        totalAmount: { type: number }
        currency: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              productId: { type: string }
              productName: { type: string }
              productCategory: { type: string }
              quantity: { type: integer }
        afterSalesStatus: { type: string }
    LogisticsSnapshot:
      type: object
      required: [status, signed]
      properties:
        status: { type: string }
        signed: { type: boolean }
        lastMeaningfulEventAt: { type: [string, 'null'], format: date-time }
        stalledHours: { type: [integer, 'null'] }
    EligibilityRequest:
      type: object
      required: [orderId, reasonCode]
      properties:
        orderId: { type: string }
        reasonCode: { type: string }
    EligibilityDecision:
      type: object
      required: [eligible, allowedAction, approvalRequired, ruleCode, ruleVersion]
      properties:
        eligible: { type: boolean }
        allowedAction:
          type: string
          description: Java-owned forward-compatible action value. Known V1 values are REFUND_ONLY, RETURN, RETURN_REFUND, MANUAL_REVIEW, DENY. Consumers must fail closed / SAFE_STOP on an unknown value instead of treating an additive backend value as a transport parse failure.
        maxRefundAmount: { type: [number, 'null'] }
        approvalRequired: { type: boolean }
        ruleCode: { type: string, minLength: 1 }
        ruleVersion: { type: integer, minimum: 1 }
        reasonCodes:
          type: array
          items: { type: string }
    CreateRefundRequest:
      type: object
      required: [orderId, reasonCode, runId]
      properties:
        orderId: { type: string }
        reasonCode: { type: string }
        requestedAmount: { type: [number, 'null'] }
        approvalRequestId: { type: [string, 'null'] }
        runId: { type: string }
    RefundResult:
      type: object
      properties:
        refundRequestId: { type: string }
        status: { type: string }
        acceptedAmount: { type: number }
    CreateReturnRequest:
      type: object
      required: [orderId, reasonCode, runId]
      properties:
        orderId: { type: string }
        reasonCode: { type: string }
        returnMethod: { type: [string, 'null'] }
        approvalRequestId: { type: [string, 'null'] }
        runId: { type: string }
    ReturnResult:
      type: object
      properties:
        returnRequestId: { type: string }
        status: { type: string }
        returnDeadline: { type: [string, 'null'], format: date-time }
    CreateTicketRequest:
      type: object
      required: [category, evidenceSummary, runId]
      properties:
        orderId: { type: [string, 'null'] }
        category: { type: string }
        evidenceSummary: { type: string }
        runId: { type: string }
    TicketResult:
      type: object
      properties:
        ticketId: { type: string }
        status: { type: string }
    CreateApprovalRequest:
      type: object
      required: [runId, orderId, actionType, riskReason]
      properties:
        runId: { type: string }
        orderId: { type: string }
        actionType: { type: string }
        amount: { type: [number, 'null'] }
        riskReason: { type: string }
    ApprovalResult:
      type: object
      required: [approvalRequestId, runId, orderId, actionType, status]
      properties:
        approvalRequestId: { type: string }
        runId: { type: string }
        orderId: { type: string }
        actionType: { type: string }
        amount: { type: [number, 'null'] }
        riskReason: { type: [string, 'null'] }
        status:
          type: string
          description: Java-owned forward-compatible approval status. Known V1 values are PENDING, APPROVED, DENIED, EXPIRED; consumers must fail closed on unknown values.
        decidedBy: { type: [string, 'null'] }
        decidedAt: { type: [string, 'null'], format: date-time }
    AfterSalesStatus:
      type: object
      properties:
        refunds:
          type: array
          items: { $ref: '#/components/schemas/RefundResult' }
        returns:
          type: array
          items: { $ref: '#/components/schemas/ReturnResult' }
    ErrorResponse:
      type: object
      required: [errorCode, message, retryable, traceId]
      properties:
        errorCode: { type: string }
        message: { type: string }
        retryable: { type: boolean }
        traceId: { type: string }
        details: { type: object, additionalProperties: true }
security:
  - bearerAuth: []
