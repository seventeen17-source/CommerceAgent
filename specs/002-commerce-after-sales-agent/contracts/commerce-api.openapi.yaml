openapi: 3.1.0
info: {title: CommerceAgent MVP Business API, version: 2.0.0}
servers:
  - url: http://localhost:8080/api/v1
security: [{bearerAuth: []}]
paths:
  /orders:
    get:
      operationId: listOrders
      description: Active customer's own orders only. More matches require clarification.
      parameters:
        - {in: query, name: productQuery, schema: {type: string, maxLength: 200}}
      responses:
        '200':
          description: Up to 20 order summaries
          content:
            application/json:
              schema:
                type: object
                required: [items, hasMore]
                properties:
                  items: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/Order'}}
                  hasMore: {type: boolean}
        default: {$ref: '#/components/responses/Error'}
  /orders/{orderId}:
    get:
      operationId: getOrder
      parameters: [{$ref: '#/components/parameters/OrderId'}]
      responses:
        '200': {description: Owner-scoped order, content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}}
        default: {$ref: '#/components/responses/Error'}
  /orders/{orderId}/logistics:
    get:
      operationId: getLogistics
      parameters: [{$ref: '#/components/parameters/OrderId'}]
      responses:
        '200': {description: Authoritative logistics, content: {application/json: {schema: {$ref: '#/components/schemas/Logistics'}}}}
        default: {$ref: '#/components/responses/Error'}
  /after-sales/eligibility:
    post:
      operationId: checkEligibility
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/EligibilityInput'}}}
      responses:
        '200': {description: HTTP success may contain DENY or MANUAL_REVIEW, content: {application/json: {schema: {$ref: '#/components/schemas/Eligibility'}}}}
        default: {$ref: '#/components/responses/Error'}
  /after-sales/requests:
    post:
      operationId: createAfterSalesRequest
      description: Customer only. Same key and payload replay returns the existing result. No client amount. Recheck current state and approval in one transaction. Creation is not payment completion.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ActionInput'}}}
      responses:
        '200': {description: New or replayed request, content: {application/json: {schema: {$ref: '#/components/schemas/AfterSalesRequest'}}}}
        default: {$ref: '#/components/responses/Error'}
  /after-sales/requests/{requestId}:
    get:
      operationId: getAfterSalesRequest
      parameters:
        - {in: path, name: requestId, required: true, schema: {$ref: '#/components/schemas/Id'}}
      responses:
        '200': {description: Owner-scoped verification, content: {application/json: {schema: {$ref: '#/components/schemas/AfterSalesRequest'}}}}
        default: {$ref: '#/components/responses/Error'}
  /operations/{operationId}:
    get:
      operationId: getOperation
      description: Scoped to the current user. ABSENT means not visible now, not proof that an earlier request cannot commit. Another user's key is indistinguishable from ABSENT.
      parameters:
        - {in: path, name: operationId, required: true, schema: {$ref: '#/components/schemas/Id'}}
      responses:
        '200': {description: Committed operation or ABSENT, content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}}
        default: {$ref: '#/components/responses/Error'}
  /approvals:
    post:
      operationId: createApproval
      description: Customer creates PENDING only. Java derives amount, expiry and fingerprint. Creation is idempotent.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalInput'}}}
      responses:
        '200': {description: New or existing approval, content: {application/json: {schema: {$ref: '#/components/schemas/Approval'}}}}
        default: {$ref: '#/components/responses/Error'}
    get:
      operationId: listApprovals
      description: APPROVER role only. Not available to the Agent as a tool.
      parameters:
        - {in: query, name: status, schema: {type: string, enum: [PENDING, APPROVED, DENIED, CONSUMED, EXPIRED], default: PENDING}}
      responses:
        '200': {description: Approval list, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Approval'}}}}}
        default: {$ref: '#/components/responses/Error'}
  /approvals/{approvalId}:
    get:
      operationId: getApproval
      description: Order owner or authorized APPROVER. Read permission never grants approval permission.
      parameters: [{$ref: '#/components/parameters/ApprovalId'}]
      responses:
        '200': {description: Authoritative approval used for resume, content: {application/json: {schema: {$ref: '#/components/schemas/Approval'}}}}
        default: {$ref: '#/components/responses/Error'}
  /approvals/{approvalId}/decision:
    post:
      operationId: decideApproval
      description: APPROVER only. Repeating the same decision by the same actor is idempotent; conflicting or terminal consumed decisions are 409. Never a customer tool.
      parameters: [{$ref: '#/components/parameters/ApprovalId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: {type: string, enum: [APPROVE, DENY]}
      responses:
        '200': {description: Authoritative decision, content: {application/json: {schema: {$ref: '#/components/schemas/Approval'}}}}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    OrderId: {in: path, name: orderId, required: true, schema: {$ref: '#/components/schemas/Id'}}
    ApprovalId: {in: path, name: approvalId, required: true, schema: {$ref: '#/components/schemas/Id'}}
    IdempotencyKey: {in: header, name: Idempotency-Key, required: true, schema: {$ref: '#/components/schemas/Id'}}
  responses:
    Error:
      description: Stable errors; see runtime-contracts.md for status and handling. Never return credentials or another customer's identifiers.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  schemas:
    Id: {type: string, format: uuid}
    Action: {type: string, enum: [REFUND_ONLY, RETURN_REFUND]}
    Reason: {type: string, enum: [NOT_RECEIVED, UNWANTED, DEFECT_REPORTED]}
    Money: {type: integer, format: int64, minimum: 1, maximum: 100000000}
    Order:
      type: object
      required: [orderId, productName, category, status, amountMinor, currency, createdAt, version, afterSalesRequestId]
      properties:
        orderId: {$ref: '#/components/schemas/Id'}
        productName: {type: string}
        category: {type: string, enum: [STANDARD, ELECTRONICS, DIGITAL]}
        status: {type: string, enum: [SHIPPED, DELIVERED, CANCELLED]}
        amountMinor: {$ref: '#/components/schemas/Money'}
        currency: {type: string, const: CNY}
        createdAt: {type: string, format: date-time}
        deliveredAt: {type: [string, 'null'], format: date-time}
        version: {type: integer, format: int64, minimum: 0}
        afterSalesRequestId: {type: [string, 'null'], format: uuid}
    Logistics:
      type: object
      required: [orderId, status, signed, lastEventAt, stalledHours, evaluatedAt]
      properties:
        orderId: {$ref: '#/components/schemas/Id'}
        status: {type: string}
        signed: {type: boolean}
        lastEventAt: {type: [string, 'null'], format: date-time}
        stalledHours: {type: [integer, 'null'], minimum: 0}
        evaluatedAt: {type: string, format: date-time}
    EligibilityInput:
      type: object
      additionalProperties: false
      required: [orderId, reasonCode]
      properties:
        orderId: {$ref: '#/components/schemas/Id'}
        reasonCode: {$ref: '#/components/schemas/Reason'}
    Eligibility:
      type: object
      required: [orderId, orderVersion, allowedAction, amountMinor, currency, approvalRequired, ruleCode, ruleVersion, policyCode, policyVersion, reasonCodes, evaluatedAt]
      properties:
        orderId: {$ref: '#/components/schemas/Id'}
        orderVersion: {type: integer, format: int64, minimum: 0}
        allowedAction: {type: string, enum: [REFUND_ONLY, RETURN_REFUND, DENY, MANUAL_REVIEW]}
        amountMinor: {anyOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
        currency: {type: string, const: CNY}
        approvalRequired: {type: boolean}
        ruleCode: {type: string}
        ruleVersion: {type: string}
        policyCode: {type: string}
        policyVersion: {type: string}
        reasonCodes: {type: array, items: {type: string}}
        evaluatedAt: {type: string, format: date-time}
    ActionInput:
      type: object
      additionalProperties: false
      required: [orderId, runId, actionType, reasonCode, expectedOrderVersion, ruleCode, ruleVersion]
      properties:
        orderId: {$ref: '#/components/schemas/Id'}
        runId: {$ref: '#/components/schemas/Id'}
        actionType: {$ref: '#/components/schemas/Action'}
        reasonCode: {$ref: '#/components/schemas/Reason'}
        expectedOrderVersion: {type: integer, format: int64, minimum: 0}
        ruleCode: {type: string, minLength: 1}
        ruleVersion: {type: string, minLength: 1}
        approvalId: {type: [string, 'null'], format: uuid}
    ApprovalInput:
      type: object
      additionalProperties: false
      required: [orderId, runId, actionType, reasonCode, expectedOrderVersion, ruleCode, ruleVersion]
      properties:
        orderId: {$ref: '#/components/schemas/Id'}
        runId: {$ref: '#/components/schemas/Id'}
        actionType: {$ref: '#/components/schemas/Action'}
        reasonCode: {$ref: '#/components/schemas/Reason'}
        expectedOrderVersion: {type: integer, format: int64, minimum: 0}
        ruleCode: {type: string, minLength: 1}
        ruleVersion: {type: string, minLength: 1}
    AfterSalesRequest:
      type: object
      required: [requestId, orderId, runId, actionType, reasonCode, amountMinor, currency, status, operationId, createdAt]
      properties:
        requestId: {$ref: '#/components/schemas/Id'}
        orderId: {$ref: '#/components/schemas/Id'}
        runId: {$ref: '#/components/schemas/Id'}
        actionType: {$ref: '#/components/schemas/Action'}
        reasonCode: {$ref: '#/components/schemas/Reason'}
        amountMinor: {$ref: '#/components/schemas/Money'}
        currency: {type: string, const: CNY}
        status: {type: string, const: CREATED}
        operationId: {$ref: '#/components/schemas/Id'}
        createdAt: {type: string, format: date-time}
    Operation:
      oneOf:
        - type: object
          additionalProperties: false
          required: [operationId, status]
          properties:
            operationId: {$ref: '#/components/schemas/Id'}
            status: {type: string, const: ABSENT}
        - type: object
          additionalProperties: false
          required: [operationId, status, kind, resourceId]
          properties:
            operationId: {$ref: '#/components/schemas/Id'}
            status: {type: string, const: SUCCEEDED}
            kind: {type: string, enum: [CREATE_AFTER_SALES, CREATE_APPROVAL]}
            resourceId: {$ref: '#/components/schemas/Id'}
    Approval:
      type: object
      required: [approvalId, orderId, runId, actionType, reasonCode, amountMinor, currency, status, orderVersion, ruleCode, ruleVersion, expiresAt, createdAt]
      properties:
        approvalId: {$ref: '#/components/schemas/Id'}
        orderId: {$ref: '#/components/schemas/Id'}
        runId: {$ref: '#/components/schemas/Id'}
        actionType: {$ref: '#/components/schemas/Action'}
        reasonCode: {$ref: '#/components/schemas/Reason'}
        amountMinor: {$ref: '#/components/schemas/Money'}
        currency: {type: string, const: CNY}
        status: {type: string, enum: [PENDING, APPROVED, DENIED, CONSUMED, EXPIRED]}
        orderVersion: {type: integer, format: int64, minimum: 0}
        ruleCode: {type: string}
        ruleVersion: {type: string}
        expiresAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        decidedBy: {type: [string, 'null'], format: uuid}
    Error:
      type: object
      additionalProperties: false
      required: [errorCode, message, retryable, traceId]
      properties:
        errorCode: {type: string}
        message: {type: string}
        retryable: {type: boolean}
        traceId: {type: string}
