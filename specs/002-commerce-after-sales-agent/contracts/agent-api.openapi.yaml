openapi: 3.1.0
info:
  title: CommerceAgent Agent API
  version: 0.1.0
servers:
  - url: http://agent-service:8000/api/v1
paths:
  /agent/runs:
    post:
      summary: Create an Agent run from a natural-language after-sales request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRunRequest' }
      responses:
        '201':
          description: Run created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRunView' }
  /agent/runs/{runId}:
    get:
      summary: Get current Agent run state
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Run state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRunView' }
  /agent/runs/{runId}/events:
    get:
      summary: Stream structured run events for UI trace
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Server-sent events stream
          content:
            text/event-stream:
              schema: { type: string }
  /agent/runs/{runId}/input:
    post:
      summary: Supply user clarification/input to a waiting run
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
      responses:
        '200':
          description: Run resumed or updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRunView' }
  /agent/runs/{runId}/resume:
    post:
      summary: Resume a checkpointed run after authoritative approval/business event
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                approvalRequestId: { type: [string, 'null'] }
      responses:
        '200':
          description: Run resumed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRunView' }
  /agent/runs/{runId}/trace:
    get:
      summary: Retrieve structured state/tool timeline
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Trace timeline
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RunEvent' }
  /eval/runs:
    post:
      summary: Launch an offline evaluation run for a versioned dataset/system version
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEvalRunRequest' }
      responses:
        '202':
          description: Eval accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvalRunView' }
  /eval/runs/{evalRunId}:
    get:
      summary: Get evaluation summary
      parameters:
        - in: path
          name: evalRunId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Eval summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvalRunView' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RunId:
      in: path
      name: runId
      required: true
      schema: { type: string }
  schemas:
    CreateRunRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1 }
    AgentRunView:
      type: object
      required: [runId, status, stepCount]
      properties:
        runId: { type: string }
        status:
          type: string
          enum: [RUNNING, WAITING_USER, WAITING_APPROVAL, COMPLETED, ESCALATED, FAILED, SAFE_STOP]
        intent: { type: [string, 'null'] }
        resolvedOrderId: { type: [string, 'null'] }
        currentNode: { type: [string, 'null'] }
        nextAction: { type: [string, 'null'] }
        stepCount: { type: integer }
        finalAction: { type: [string, 'null'] }
        finalMessage: { type: [string, 'null'] }
        approvalRequestId: { type: [string, 'null'] }
        errorCode: { type: [string, 'null'] }
    RunEvent:
      type: object
      required: [eventType, timestamp]
      properties:
        eventType:
          type: string
          enum: [STATE_TRANSITION, TOOL_CALL, TOOL_RESULT, RETRY, CLARIFICATION, APPROVAL, WRITE, VERIFICATION, ERROR]
        node: { type: [string, 'null'] }
        toolName: { type: [string, 'null'] }
        status: { type: [string, 'null'] }
        errorCode: { type: [string, 'null'] }
        latencyMs: { type: [integer, 'null'] }
        summary: { type: [string, 'null'] }
        timestamp: { type: string, format: date-time }
    CreateEvalRunRequest:
      type: object
      required: [datasetVersion, systemVersion]
      properties:
        datasetVersion: { type: string }
        split: { type: string, enum: [DEV, TEST], default: DEV }
        systemVersion: { type: string, enum: [BASELINE, V1, OPTIMIZED] }
        modelConfigRef: { type: [string, 'null'] }
    EvalRunView:
      type: object
      properties:
        evalRunId: { type: string }
        datasetVersion: { type: string }
        systemVersion: { type: string }
        status: { type: string }
        totalCases: { type: integer }
        completedCases: { type: integer }
        metrics:
          type: object
          additionalProperties: { type: number }
security:
  - bearerAuth: []
