openapi: 3.1.0
info:
  title: CommerceAgent Agent API
  version: 0.2.2
servers:
  - url: http://agent-service:8000/api/v1
paths:
  /agent/runs:
    post:
      summary: Create an Agent run from a natural-language after-sales request
      description: Creates a run owned by the authenticated customer principal. Principal identity comes from JWT context, never request/model text.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRunRequest' }
      responses:
        '201':
          description: Run created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRunView' }
        '401': { $ref: '#/components/responses/Error' }
  /agent/runs/{runId}:
    get:
      summary: Get current Agent run state
      description: Customer may read only a run owned by the authenticated principal; operational/support access must be explicitly authorized.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Run state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRunView' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /agent/runs/{runId}/events:
    get:
      summary: Stream structured run events for UI trace
      description: Streams structured events for an authorized run only; hidden chain-of-thought and raw credentials are never emitted.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Server-sent events stream
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /agent/runs/{runId}/input:
    post:
      summary: Supply user clarification/input to a waiting run
      description: Only the owner of a WAITING_USER run may submit clarification input; input cannot alter authenticated principal or permissions.
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1 }
      responses:
        '200':
          description: Run resumed or updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRunView' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /agent/runs/{runId}/resume:
    post:
      summary: Resume a checkpointed run after authoritative approval/business event
      description: >-
        Resume never trusts approval status supplied by the caller. For WAITING_APPROVAL the checkpoint's
        approvalRequestId selects the record; an optional body id may only repeat that reference. Before the
        run is claimed, the Agent service owner-scoped re-reads Java ApprovalRequest and requires APPROVED plus
        exact run/order/action/amount binding. The resumed graph re-runs eligibility, and the final Java write
        re-checks the approval again.
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                approvalRequestId:
                  type: [string, 'null']
                  description: Optional claim about the checkpointed approval reference; it cannot assert status or authority.
      responses:
        '200':
          description: Run resumed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRunView' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409':
          $ref: '#/components/responses/Error'
          description: >-
            The run is not resumable, the caller supplied a different approval reference, the approval is still
            pending/denied/expired, or its authoritative run/order/action/amount binding does not match the checkpoint.
        '503':
          $ref: '#/components/responses/Error'
          description: The authoritative Commerce approval record could not be re-read safely.
  /agent/runs/{runId}/trace:
    get:
      summary: Retrieve structured state/tool timeline
      description: Owner-authorized structured trace only; no hidden chain-of-thought, auth token, or secret value is returned.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Trace timeline
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RunEvent' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RunId:
      in: path
      name: runId
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Machine-readable error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    CreateRunRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1 }
    AgentRunView:
      type: object
      required: [runId, status, stepCount]
      properties:
        runId: { type: string }
        status:
          type: string
          enum: [RUNNING, WAITING_USER, WAITING_APPROVAL, COMPLETED, ESCALATED, FAILED, SAFE_STOP]
        intent: { type: [string, 'null'] }
        resolvedOrderId: { type: [string, 'null'] }
        currentNode: { type: [string, 'null'] }
        nextAction: { type: [string, 'null'] }
        stepCount: { type: integer }
        finalAction: { type: [string, 'null'] }
        finalMessage: { type: [string, 'null'] }
        approvalRequestId: { type: [string, 'null'] }
        verificationStatus:
          description: >-
            What authority confirmed, not what a write response said. Null means either that nothing
            was verified or that retention reclaimed the payload; checkpointCompactedAt tells the two
            apart.
          type: [string, 'null']
          enum: [NOT_RUN, PENDING, VERIFIED_SUCCESS, VERIFIED_FAILURE, UNKNOWN, null]
        verifiedRefundRequestId:
          description: The refund id authority confirmed. Null unless verificationStatus is VERIFIED_SUCCESS.
          type: [string, 'null']
        clarification:
          description: >-
            What the customer must supply before the run can continue, present only while the run is
            WAITING_USER. A customer-facing channel on purpose: 'waiting for more information' is not
            actionable, and candidateOrderIds are the caller's own orders, so they leak nothing.
            ORDER_AMBIGUOUS means several orders are plausible; ORDER_NO_MATCH means the product the
            customer named matched none of them, so the candidates are a fallback list to confirm
            rather than a filtered answer.
          type: [object, 'null']
          additionalProperties: false
          required: [kind]
          properties:
            kind:
              type: string
              enum: [INTENT_UNKNOWN, ORDER_AMBIGUOUS, ORDER_NO_MATCH]
            candidateOrderIds:
              type: array
              items: { type: string }
        version:
          description: The compare-and-swap token a client passes back when retrying a write.
          type: integer
        checkpointCompactedAt:
          description: When retention reclaimed this run's payload, or null while it is still held.
          type: [string, 'null']
          format: date-time
        errorCode: { type: [string, 'null'] }
    RunEvent:
      type: object
      required: [eventType, timestamp]
      properties:
        eventType:
          type: string
          enum: [STATE_TRANSITION, TOOL_CALL, TOOL_RESULT, RETRY, CLARIFICATION, APPROVAL, WRITE, VERIFICATION, ERROR]
        node: { type: [string, 'null'] }
        toolName: { type: [string, 'null'] }
        status: { type: [string, 'null'] }
        errorCode: { type: [string, 'null'] }
        latencyMs: { type: [integer, 'null'] }
        summary: { type: [string, 'null'] }
        timestamp: { type: string, format: date-time }
    ErrorResponse:
      type: object
      required: [errorCode, message, retryable, traceId]
      properties:
        errorCode: { type: string }
        message: { type: string }
        retryable: { type: boolean }
        traceId: { type: string }
        details: { type: object, additionalProperties: true }
security:
  - bearerAuth: []
