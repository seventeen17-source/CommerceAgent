[project]
name = "agent-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary,pool]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
# 与 Java 侧保持一致的行宽取向；Python 社区主流为 88/100，这里取 100
line-length = 100
target-version = "py313"
# 导入根是项目根目录：包名是 `app.*`（因为 `app/__init__.py` 存在），
# 不是 `agent.*`。曾误配为 ["app", "tests"]，导致 ruff 把项目自己的
# `app.*` 判成第三方库，进而给出"把 app 与 pytest 合并为一组"的错误建议。
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort（导入排序）
    "UP",   # pyupgrade（用新语法）
    "B",    # flake8-bugbear（常见陷阱）
    "ASYNC",# flake8-async（阻塞调用等异步陷阱）
    "S",    # flake8-bandit（安全问题，例如硬编码密码）
    "RUF",  # ruff 自带规则
]
# 本项目的注释与 docstring 使用中文，全角标点是有意为之。
# 这里逐一放行，而不是关掉 RUF002/RUF003 —— 关掉会同时失去对
# 西里尔字母 а、希腊字母 ο 等"真同形字"冒充 ASCII 的检测能力。
allowed-confusables = [
    "，", "。", "、", "：", "；", "！", "？",
    "（", "）", "【", "】", "《", "》",
    "“", "”", "‘", "’", "—", "…",
]

[tool.ruff.lint.isort]
# 显式声明项目自身的一等包，避免再次被 src 推断误导。
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# 测试里允许 assert。
"tests/**" = ["S101"]
# settings.py 中的口令仅是本地开发占位默认值，真实环境应由环境变量覆盖；
# 仅在这个配置文件放行，避免整个项目失去硬编码 secret 检测。
"app/config/settings.py" = ["S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
show_error_codes = true
# LangGraph / psycopg 等第三方库的 stub 完整度不一致，逐个按需处理而不是全局放水
[[tool.mypy.overrides]]
module = ["langgraph.*", "langgraph_checkpoint_postgres.*"]
ignore_missing_imports = true

