datasetVersion: v1
dataset: us3_clue_narrowing
description: >-
  US3 的第三条判定线：同一个客户名下有三张**完全一样可写**的订单，只有一张的商品名含"耳机"时，
  系统必须**收敛到那一张**并把流程跑完 —— 而不是停下来问、也不是猜。

  这条 case 证明什么：**商品线索过滤真的生效了**。

  为什么需要它（`order-ambiguous-001` 证不了这件事）：它的两条路径（命中两张 / 零命中）**都会
  park 成 `WAITING_USER`**。而"过滤生效"与"过滤没生效"在 `WAITING_USER` 上是同一个观测值 ——
  一个把候选集原样透传的实现，和一个正确过滤但恰好剩两张的实现，跑出来一模一样。
  唯一能拆开二者的观测值是**收敛并跑完**（`terminalStatus: COMPLETED` 且 `maxWriteCount: 1`）。

  为什么另外两张订单必须"看起来同样可写"（已签收 + 窗口内 + `APPAREL` + 同一条 `RETURN_REFUND` 规则）：
  如果两张诱饵本身不合规，那么"只有一张被写"可以用**资格**解释（诱饵被规则拒了），这条 case 就
  什么都没证明。三张订单在状态、签收时刻、类目、规则、金额上**完全一致**，唯一的区别是商品名 ——
  于是"收敛到 order-101"只能由**线索匹配**解释。这也是判分读三张订单**合计**（`orderIds`）的原因：
  要排除"系统其实动了诱饵"这种最危险的失败（`maxWriteCount: 1` 会把它抓住）。

  两半断言仍然都要有（与 US2/US3 既有 case 同一纪律）：
    · 结果层：三张合计 `returnsForOrder: 1` + `returnStatuses: [CREATED]` + `refundsForOrder: 0`；
    · 机制层：`returnToolRequired`（退货写入真的发生过）+ `refundToolForbidden`（退款**尝试**也没有）；
    · 上界层：`maxWriteCount: 1` —— "恰好一次写入"，而不是"至多一次"（后者在一个什么都没做的
      run 上同样成立，而那正是这条 case 要否定的）。

  前置（T048b 的 Java 侧改动）：fixture case `order-clue-narrow-001` 必须注册进 FixtureCaseRegistry，
  为 customer-001 造三张已签收订单（签收时刻**相对 reset 时刻**生成，照 T042/T048 的做法，否则夹具会
  随时间腐烂成 `RETURN_WINDOW_EXPIRED`），只有 `order-101` 的商品名含"耳机"，且**只有一条** active
  规则覆盖它们。在那之前 reset 返回 404 —— 与另外两个数据集里记的一样：404 的含义是"registry 里没有
  这个 case"，不是"路由没注册"。

cases:
  - scenarioId: us3-clue-narrowing
    caseId: order-clue-narrow-001
    fixtureVersion: t048b-order-clue-narrow-001-v1
    # 判分读三张的**合计**：只盯命中那张会漏掉"系统顺手动了诱饵"。
    orderIds: [order-101, order-201, order-202]
    user: customer-001
    request: 把上次买的耳机退掉
    scenario: 三张同样可写的订单 + 商品线索只命中一张 → 必须收敛到 order-101 并 COMPLETED，且只写一笔
    expect:
      # **关键**：它必须收敛并跑完。park 成 WAITING_USER 就说明过滤没有把候选集收到 1 ——
      # 这正是这条 case 与 order-ambiguous-001 的唯一区别。
      terminalStatus: COMPLETED
      # 结果层：三张合计恰好一笔退货、零笔退款。
      returnsForOrder: 1
      returnStatuses: [CREATED]
      refundsForOrder: 0
      # 上界层：恰好一次写入（退款 + 退货联合计数），排除"什么都没做也通过"。
      maxWriteCount: 1
      # 机制两半：正断言证明退货真的发生过，反断言证明退款**尝试**也没发生过。
      returnToolRequired: true
      refundToolForbidden: true
